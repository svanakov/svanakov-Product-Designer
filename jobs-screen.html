      { h: 'Гипотезы и решения', g: 'Решение', cards: [

  en: {
    title: 'Redesign of a Classifieds Platform’s Jobs Home Screen',
    sub: 'A study of the service: audience, interviews, hypotheses, prototypes and user checks. Mobile app, iOS.',
    tags: ['Mobile', 'UX Research', 'Product Design', 'Prototyping'],
    sections: [
      { h: 'Context', g: 'Brief', p: [
        'The home page of the “Jobs” category in the classifieds platform’s mobile app serves two different scenarios: job seekers and people hiring. It helps users get oriented and narrow the search. Users reach it from the platform’s main screen and start their vacancy search there.',
        'Today the screen looks the same for someone who has just started looking for a job and for someone who has been searching for months.',
      ] },
      { h: 'Task', g: 'Brief', p: [
        'Propose a redesign of the first screen of the “Jobs” home page from the job seeker’s point of view. iOS, 375×812 screen. Come up with features and scenarios that raise the screen’s MAU, lead users to a useful action faster and help them come back.',
      ] },
      { h: 'Business goals', g: 'Brief', p: [
        'MAU counts unique people who open the screen at least once a month. So it grows not from frequent visits but from two things: new people arrive, or existing users come back two months in a row. This splits the task into two requirements: lead to a useful result faster and give a reason to return.',
        'The platform sells employers access to live job seekers. The more job seekers return regularly, the more it can earn from listings.',
      ] },
      { h: 'Audience and segments', g: 'Research', p: [
        'I used two segmentation criteria. First: newcomer or experienced in searching for jobs through this app. It follows from the context: the screen is the same for a newcomer and for someone who has been searching for months. Second: type of need. I collected it from the tags on the screen: side jobs, shifts, temporary work, over 45, students, from 14 on one side; full day and large companies on the other.',
        'The intersection of the two criteria gave four segments.',
      ], cards: [
        { tag: 'Segment 1', h: 'Newcomer, one-off earnings', p: 'When I need money and do not know where to start, I want to quickly see suitable options without sorting through complex filters, so I can start earning as soon as possible. This is probably their first experience with such an app. Risk: they leave right at the entrance if the screen feels overloaded.' },
        { tag: 'Segment 2', h: 'Experienced, one-off earnings', p: 'When I need a new shift or order, I want to go straight to a familiar set of vacancies without explaining again what I need, so I do not lose time between jobs. They will be annoyed by having to refill the same data every time: the value is the speed of the repeat “search, apply” cycle.' },
        { tag: 'Segment 3', h: 'Experienced, permanent job', p: 'When I have already applied, I want to understand what is happening with my applications and see new relevant offers, so I do not miss the moment or check status manually through other channels. The only clear reason to open the app again: find out what happened to an application or see something new for an existing query.' },
        { tag: 'Segment 4', h: 'Newcomer, permanent job', p: 'When I look for a permanent job, I want to understand right away what I can count on here, so I do not have to guess what suits me. They try to find a permanent job through such an app for the first time and do not understand how everything works: categories, filters, what each block means.' },
      ] },
      { h: 'Competitor analysis', g: 'Research', p: [

      ] },

      ], list: [
        'Newcomers are afraid to look for a side job through an app: it is unfamiliar territory. It is easier to ask friends or go straight to clear options like waiter, courier or pickup point staff.',
        'Those who have long been looking for a permanent job open the app for a reason: they heard about an interesting vacancy in their field or that a well-known company opened a position.',
        'An active job seeker uses several sources at once, not one app: aggregators, social media channels, company sites.',
        'People in an active search often keep a separate Excel or Google Sheets table so they do not lose vacancies and their statuses.',
        'A recruiter may reply both in the app chat and via the listed contacts, so the job seeker has to check both places.',
        'During a long unsuccessful search motivation drops and people lose heart.',
      ] },
      { h: 'What does not work today', g: 'Research', list: [

      { h: 'Hypotheses and solutions', g: 'Solution', cards: [

      ], results: [

        ['Favorites', '3 of 3', 'No errors. They found the section among categories on their own and did not confuse it with “Viewed”.'],
        ['“You searched” at the top', '3 of 3', 'No errors. The position was clear at once, no need to type the query again.'],
        ['Resume banner', '2 of 3', 'One respondent did not notice the banner right away. It needs a stronger accent.'],
      ] },
      { h: 'Conclusions', g: 'Outcome', p: [
        'Three of four solutions were clear without rework; the fourth (the resume banner) needs rework.',
        'Two of the segments already have a reason to return: an experienced one-off earner waits for a shift, an experienced permanent-job seeker waits for an answer. Newcomers have no reason to return; the quality of the first visit matters more for them. I assume the first bet should be on segments with experience rather than on newcomers.',
      ], note: 'This is a prototype check with a small sample (three respondents), not metrics of a real product. The conclusion about segments is a hypothesis and has not been measured.' },
    ],
  },
};

// Итоговый раздел в конце: короткий вывод и тот же список результатов проверки, чтобы их не нужно было искать выше.
for (const l of ['ru', 'en']) {
  const check = D[l].sections.find((x) => x.results);
  D[l].sections.push(l === 'ru'
    ? { h: 'Результаты', g: 'Итоги', p: ['Три решения из четырёх подтвердили понятность без доработок, четвёртое (плашка резюме) требует доработки. Проверка прототипа на трёх респондентах, это не метрики реального продукта.'], results: check.results }
    : { h: 'Results', g: 'Outcome', p: ['Three of four solutions were clear without rework; the fourth (the resume banner) needs rework. A prototype check with three respondents, not metrics of a real product.'], results: check.results });
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lang = getLang() === 'en' ? 'en' : 'ru';
const d = D[lang];
document.title = d.title + ' — ' + (lang === 'en' ? 'Sergei Vanakov' : 'Сергей Ванаков');
document.documentElement.lang = lang;

const secHtml = (s, i) => `
  <section id="sec-${i + 1}" data-group="${esc(s.g || '')}">
    <h2>${esc(s.h)}</h2>
    ${(s.p || []).map((p) => `<p>${esc(p)}</p>`).join('')}
    ${s.cards ? `<div class="cs__grid" style="margin-top:${s.p ? 20 : 0}px">${s.cards.map((c) => `<div class="cs__card"><span class="tag">${esc(c.tag)}</span><h3>${esc(c.h)}</h3><p>${esc(c.p)}</p></div>`).join('')}</div>` : ''}
    ${s.list ? `<ul class="list" style="margin-top:${s.p ? 20 : 0}px">${s.list.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
    ${s.results ? `<div class="cs__results" style="margin-top:20px">${s.results.map((r) => `<div class="cs__row"><b>${esc(r[0])}</b><span class="cs__score">${esc(r[1])}</span><span class="d">${esc(r[2])}</span></div>`).join('')}</div>` : ''}
    ${s.note ? `<p class="cs__note" style="margin-top:20px">${esc(s.note)}</p>` : ''}
  </section>`;

document.getElementById('cs').innerHTML = `
  <header>
    <h1>${esc(d.title)}</h1>
    <p class="cs__sub">${esc(d.sub)}</p>
    <ul class="cs__meta">${d.tags.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
  </header>
  ${d.sections.map((s, i) => secHtml(s, i)).join('')}`;
</script>
<script type="module" src="./site.js"></script>
</body>
</html>
