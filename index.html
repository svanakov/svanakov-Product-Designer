<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <style>
    body { margin: 0; }
    html { scroll-behavior: smooth; }
    ::selection { background: oklch(0.58 0.19 264 / 0.25); }
    @media (max-width: 720px) {
      .proj-title { font-size: 26px !important; }
      .hero-name { font-size: 34px !important; }
      .header-wrap { padding-bottom: 56px !important; }
      .proj-meta { flex-direction: column !important; gap: 12px !important; }
      .proj-desc { max-width: none !important; }
      main { gap: 56px !important; }
      .works-row { flex-direction: column !important; }
      .works-row img { width: 100% !important; height: auto !important; }
    }


    .cover-img { transition: transform 400ms ease; }
    .cover-wrap:hover .cover-img { transform: scale(1.04); }

    .project-link:hover .tag-pill {
      background: #EBF6FF !important;
      border-color: rgba(43, 117, 241, 0.35) !important;
      color: #2B75F1 !important;
    }
  </style>
</helmet>

<div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; background: #FFFFFF; color: oklch(0.19 0.006 80); min-height: 100vh;">

  <div style="position: sticky; top: 0; z-index: 10; background: #FFFFFF;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid oklch(0.9 0.004 80);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img src="./uploads/avatar.jpg" alt="Сергей Ванаков" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
        <span style="font-size: 17px; font-weight: 500; letter-spacing: -0.01em;">Сергей Ванаков</span>
      </div>
      <nav style="display: flex; gap: 28px;">
        <a href="#projects" style="color: oklch(0.19 0.006 80); text-decoration: none; font-size: 16px; transition: color 200ms ease;" style-hover="color: oklch(0.58 0.19 264);">Проекты</a>
        <a href="#works" style="color: oklch(0.19 0.006 80); text-decoration: none; font-size: 16px; transition: color 200ms ease;" style-hover="color: oklch(0.58 0.19 264);">Работы</a>
        <a href="https://t.me/svanakov" target="_blank" rel="noopener" style="color: oklch(0.19 0.006 80); text-decoration: none; font-size: 16px; transition: color 200ms ease;" style-hover="color: oklch(0.58 0.19 264);">Telegram</a>
        <a href="mailto:vanakovsergey2004@yandex.ru" style="color: oklch(0.19 0.006 80); text-decoration: none; font-size: 16px; transition: color 200ms ease;" style-hover="color: oklch(0.58 0.19 264);">Почта</a>
      </nav>
    </div>
  </div>

  <div style="max-width: 800px; margin: 0 auto; padding: 56px 32px 120px;">

    <header class="header-wrap" style="display: flex; flex-direction: column; gap: 48px; padding-bottom: 96px;">
      <h1 class="hero-name" style="font-size: 36px; line-height: 1.3; font-weight: 430; letter-spacing: -0.015em; margin: 0; max-width: 920px; text-wrap: pretty;"> Продуктовый дизайнер. <span style="color: oklch(0.5 0.008 80);">Два года проектирую понятные интерфейсы и довожу идеи от исследования до работающего прототипа.</span></h1>
    </header>

    <main id="projects" style="display: flex; flex-direction: column; gap: 88px;">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="6">
        <a href="{{ p.href }}" class="project-link" style="text-decoration: none; color: inherit; display: block;">
          <article>
            <div class="cover-wrap" style="position: relative; width: 100%;">
              <div style="position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 33px;">
                <sc-if value="{{ p.comingSoon }}">
                  <div style="position: absolute; inset: 0; background: oklch(0.87 0.004 80); display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 18px; font-weight: 500; letter-spacing: 0.02em; color: oklch(0.55 0.006 80);">Coming soon</span>
                  </div>
                </sc-if>
                <sc-if value="{{ !p.comingSoon }}">
                  <img class="cover-img" src="{{ p.cover }}" alt="{{ p.title }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
                </sc-if>
              </div>
            </div>
            <div class="proj-meta" style="display: flex; flex-direction: column; gap: 14px; margin-top: 28px;">
              <div style="display: flex; align-items: baseline; gap: 16px;">
                <span style="font-size: 14px; color: oklch(0.6 0.01 80);">{{ p.num }}</span>
                <h2 class="proj-title" style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin: 0;">{{ p.title }}</h2>
              </div>
              <p class="proj-desc" style="font-size: 17px; line-height: 1.6; color: oklch(0.42 0.006 80); margin: 0; max-width: 620px;">{{ p.description }}</p>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap;" class="tags-row">
              <sc-for list="{{ p.tags }}" as="tag" hint-placeholder-count="1">
                <span key="{{ tag.id }}" class="tag-pill" style="display: inline-flex; box-sizing: border-box; padding: 6px 10px; flex-direction: column; justify-content: center; align-items: center; gap: 10px; border-radius: 8px; border: 1px solid rgb(230, 230, 228); background: rgb(247, 247, 246); font-size: 12px; font-weight: 500; color: rgb(66, 67, 61); transition: background 200ms ease, border-color 200ms ease, color 200ms ease;">{{ tag.label }}</span>
              </sc-for>
            </div>
          </article>
        </a>
      </sc-for>
    </main>

    <section id="works" style="margin-top: 88px;">
      <h2 class="proj-title" style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 28px;">Работы</h2>
      <div class="works-row" style="display: flex; align-items: flex-start; gap: 16px;">
        <sc-for list="{{ works }}" as="work" hint-placeholder-count="1">
          <img src="{{ work.src }}" alt="{{ work.alt }}" style="width: 400px; max-width: 100%; height: auto; display: block; border-radius: 20px; border: 1px solid rgb(230, 230, 228);">
        </sc-for>
      </div>
    </section>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const mkTags = (prefix, labels) => labels.map((label, i) => ({ id: prefix + '-' + i, label }));
    const projects = [
      { num: '01', title: 'Rytmo', href: 'rytmo.html', cover: './uploads/rytmo-cover.webp', comingSoon: false, description: 'Почему люди бросают фитнес-приложения на 2–3 неделе — и как удержать их до появления привычки', tags: mkTags('p1', ['Mobile', 'UX Research', 'Product Design', 'Prototyping']) },
      { num: '02', title: 'Campus', href: 'campus.html', cover: './uploads/campus-cover.webp', comingSoon: false, description: 'Разработка своего приложения с расписаниашем пар в виде PWA. Офлайн-доступ вместо вылетающего официального приложения.', tags: mkTags('p2', ['PWA', 'UI Design', 'EdTech']) },
      { num: '03', title: 'Виток', href: '#', cover: '', comingSoon: true, description: 'Виток (Vtok) — образовательная платформа для российских школ, учебных центров и репетиторских организаций.', tags: mkTags('p3', ['Ресерч', 'Анализ конкурентов', 'Глубинки', 'Проектирование юзер флоу']) },
    ];
    const works = [
      { src: './uploads/work1.webp', alt: 'Midnight Screening' },
    ];
    return { projects, works };
  }
}
</script>
</body>
</html>
